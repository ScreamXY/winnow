name: CI

on:
  push:
    # Only confirmed non-inputs are excluded; shipped content and unknown paths run.
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'SECURITY.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/CODEOWNERS'
      - '.vscode/**'
    branches: [main]
  pull_request:
    # Only confirmed non-inputs are excluded; shipped content and unknown paths run.
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'SECURITY.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/CODEOWNERS'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, core tests, and build
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        timeout-minutes: 3
        run: brew install swiftlint
      - name: Check generated project is current
        timeout-minutes: 3
        run: scripts/xcodegen.sh --check
      - name: Lint, format, core tests, and build
        timeout-minutes: 6
        run: |
          set -o pipefail
          mkdir -p build/ci
          sh scripts/check.sh 2>&1 | tee build/ci/check.log
      - name: Upload test evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 7
